<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<!-- 只有暗色（用户 2026-09-24："去掉亮色，只保留暗色。同抖音。"）：别跟随系统浅色 -->
<meta name="color-scheme" content="dark">
<title>zizVideo</title>
<!-- favicon：文件放在 internal/web/assets/ 下（会一起嵌进二进制，改完要重建二进制）。
     现在放的是占位 SVG；你有自己的图就直接覆盖 favicon.svg，
     或者放 favicon.png / apple-touch-icon.png（180×180）再把下面两行换成对应文件名。 -->
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<!-- <link rel="apple-touch-icon" href="/apple-touch-icon.png"> -->
<link rel="stylesheet" href="/app.css">
</head>
<body>
<div id="app">
  <header id="header" class="header" hidden></header>
  <main id="view" class="view"></main>
</div>
<!-- 安卓 App 用 <base>/?zv=app#/... 打开：原生 Ui.padSystemBars 已经垫过系统栏，
     安全区不能再叠加一遍（否则底栏文字偏高、"来自 X"偏低）。这里在 CSS 生效前打标记。 -->
<script>if (location.search.indexOf("zv=app") >= 0) document.documentElement.classList.add("zv-app");</script>
<script type="module" src="/app.js"></script>
</body>
</html>
